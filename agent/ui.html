<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0a0d14;color:#edf2ff;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;transition:.2s}button:active{transform:scale(.98)}.app{display:flex;height:520px}.sidebar{width:210px;background:#10141f;border-right:1px solid #ffffff14;padding:24px 14px;display:flex;flex-direction:column}.logo{font-size:20px;font-weight:800;letter-spacing:-1px;padding:0 10px}.logo span{color:#5089ff}.company{color:#8792a7;font-size:11px;padding:5px 10px 22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav{border:0;color:#a6b0c4;text-align:left;background:transparent;padding:12px;border-radius:10px;margin:2px 0}.nav.active{background:#243252;color:#fff;transition:background .25s,color .25s}.nav{transition:background .25s,color .25s}.bottom{margin-top:auto;padding:10px;color:#7c879d}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef6475;margin-right:7px;animation:pulse-ring 2s infinite}.dot.online{background:#36d399}.dot:not(.online){animation-name:pulse-offline}@keyframes pulse-offline{50%{box-shadow:0 0 0 6px #ef647522}}@keyframes pulse-ring{50%{box-shadow:0 0 0 6px #6ccf9a18}}main{width:550px;padding:0 24px 20px}.top{height:48px;display:flex;align-items:center;justify-content:flex-end}.drag{flex:1;height:100%}.window{background:none;color:#97a3b8;border:0;font-size:19px;padding:0 9px}.page{display:none;animation:enter .22s ease}.page.active{display:block}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}h1{font-size:23px;margin:5px 0 4px;letter-spacing:-.6px}p{color:#8995ab;margin:0 0 16px}.cards{display:flex;gap:12px}.panel{background:#ffffff08;border:1px solid #ffffff14;border-radius:16px;padding:16px;box-shadow:0 12px 35px #0003}.cards .panel{width:50%;height:105px}.caption{font-size:11px;color:#9aa6bb}.number{font-size:32px;font-weight:700;margin-top:8px}.printer{font-size:15px;font-weight:600;margin-top:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.journal{margin-top:12px;height:185px}.journal-head{display:flex;justify-content:space-between;font-weight:600}.link{background:none;color:#8294b4;border:0}.logs{height:130px;overflow:auto;color:#9ba9bd;font:11px Consolas,monospace;margin-top:10px}.logs div{padding:3px}.logs .success{color:#56d3a0}.logs .error{color:#f08089}.action{margin-top:14px;width:100%;padding:11px;color:white;border:0;border-radius:10px;background:linear-gradient(110deg,#2878ff,#5544e7);font-weight:600}.spin{display:inline-block}.syncing .spin{animation:rotate 1s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}.progress{height:3px;background:#508bff;transform-origin:left;animation:progress 1s infinite;display:none}@keyframes progress{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.field label{display:block;color:#a1adc1;font-size:11px;margin:0 0 5px}.field input,.field select{width:100%;height:33px;color:#e7edfa;background:#0c101a;border:1px solid #ffffff22;border-radius:8px;padding:0 9px;outline:none}.field input:focus,.field select:focus{border-color:#4b83ff;box-shadow:0 0 0 2px #3978ff33}.wide{grid-column:span 2}.row{display:flex;gap:5px}.row button{background:#25314a;border:0;color:#dbe7ff;border-radius:8px;padding:0 10px}.toggle{display:flex;align-items:center;gap:8px;color:#c6cede;margin-top:8px}
body{zoom:.88;overflow:hidden}.app{height:113.64vh}main{height:113.64vh}.page{overflow:auto;max-height:calc(113.64vh - 48px)}.update-overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}.update-overlay[hidden]{display:none}.update-box{width:380px;background:#1a2130;border:1px solid #ffffff24;border-radius:16px;padding:24px;box-shadow:0 20px 60px #0009}.update-box p{white-space:pre-wrap;line-height:1.5}.update-box button{width:100%}</style></head><body><div class="app"><aside class="sidebar"><div class="logo">PriceSnap<span>.</span></div><div class="company" id="company">Магазин не подключён</div><button class="nav active" data-page="overview">▦　Обзор и печать</button><button class="nav" data-page="settings">⚙　Подключение</button><div class="bottom"><span class="dot" id="dot"></span><span id="status">Нет связи</span><div style="margin-top:9px;font-size:10px"><span id="version">v2.1.2</span></div></div></aside><main><div class="top"><div class="drag pywebview-drag-region"></div><button class="window" id="minimize">−</button><button class="window" id="close">×</button></div><section class="page active" id="overview"><h1>Обзор и печать</h1><p>Всё для работы вашего магазина</p><div class="cards"><div class="panel" id="counter"><div class="caption">НАПЕЧАТАНО ЗА СЕССИЮ</div><div class="number" id="printed">0</div></div><div class="panel"><div class="caption">АКТИВНЫЙ ПРИНТЕР</div><div class="printer" id="printerName">Не выбран</div></div></div><div class="panel journal"><div class="journal-head">Журнал событий <button class="link" id="clear">Очистить</button></div><div class="logs" id="logs"></div></div><div class="progress" id="progress"></div><button class="action" id="sync">↻　Синхронизировать сейчас</button></section><section class="page" id="settings"><h1>Подключение</h1><p>Настройте обмен данными и печать</p><div class="panel"><div class="form"><div class="field wide"><label>API-ключ магазина</label><div class="row"><input id="key" type="password"><button id="show">Показать</button><button id="paste">Вставить</button></div></div><div class="field wide"><label>Адрес сервера</label><input id="url"></div><div class="field wide"><label>Файл выгрузки 1С / Excel</label><div class="row"><input id="path" readonly><button id="choose">Выбрать</button></div></div><div class="field wide"><label>Принтер</label><select id="printer"></select></div></div><label class="toggle"><input type="checkbox" id="autostart"> Запускать вместе с Windows</label><button class="action" id="save">Сохранить и подключиться</button></div></section></main></div><div id="updateDialog" class="update-overlay" hidden><div class="update-box"><h1 id="updateTitle"></h1><p id="updateNotes"></p><p id="updateError" style="color:#f08089"></p><button id="updateNow" class="action">Обновить сейчас</button><button id="updateLater" class="link" style="margin-top:12px">Позже</button></div></div><script>
const $=id=>document.getElementById(id);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});$('minimize').onclick=()=>pywebview.api.minimize();$('close').onclick=()=>pywebview.api.close();$('clear').onclick=()=>$('logs').replaceChildren();$('show').onclick=()=>$('key').type=$('key').type==='password'?'text':'password';$('paste').onclick=async()=>{try{$('key').value=await pywebview.api.clipboard_text()}catch(e){log('Буфер недоступен','error')}};$('choose').onclick=async()=>{let p=await pywebview.api.choose_file();if(p)$('path').value=p};function log(message,level='info'){let d=document.createElement('div');d.className=level;d.textContent='['+new Date().toLocaleTimeString('ru-RU')+'] '+message;$('logs').append(d);$('logs').scrollTop=$('logs').scrollHeight}let displayedCount=0,countAnimation;function animateCount(target){cancelAnimationFrame(countAnimation);const start=displayedCount,t0=performance.now();function frame(now){let t=Math.min((now-t0)/650,1);displayedCount=Math.round(start+(target-start)*(1-Math.pow(1-t,3)));$('printed').textContent=displayedCount;if(t<1)countAnimation=requestAnimationFrame(frame)}countAnimation=requestAnimationFrame(frame)}function showUpdate(e){$('updateTitle').textContent='Доступна новая версия PriceSnap Agent (v'+e.version+')';$('updateNotes').textContent=e.notes;$('updateLater').hidden=e.mandatory;$('updateDialog').hidden=false}window.agentEvent=e=>{if(e.type==='update')showUpdate(e);if(e.type==='log')log(e.message,e.level);if(e.type==='connection'){$('dot').classList.toggle('online',e.online);$('status').textContent=e.online?'Онлайн':'Нет связи';if(e.company)$('company').textContent=e.company}if(e.type==='printed'){animateCount(e.count);$('counter').animate([{background:'#2563eb66'},{background:'#ffffff08'}],{duration:700})}if(e.type==='sync'){$('progress').style.display=e.active?'block':'none';$('sync').disabled=e.active;$('sync').classList.toggle('syncing',e.active)}};window.addEventListener('pywebviewready',async()=>{let d=await pywebview.api.initial();$('version').textContent='v'+d.version;if(d.update)showUpdate(d.update);for(const k of ['url','key','path'])$(k).value=d.config[k];$('autostart').checked=d.config.autostart;d.printers.forEach(p=>$('printer').add(new Option(p,p)));$('printer').value=d.config.printer;$('printerName').textContent=d.config.printer||'Не выбран';log('Приложение запущено')});$('save').onclick=async()=>{let b=$('save');b.disabled=true;let r=await pywebview.api.save({url:$('url').value,key:$('key').value,path:$('path').value,printer:$('printer').value,autostart:$('autostart').checked});b.textContent=r.ok?'✓ Сохранено':'Ошибка сохранения';$('printerName').textContent=$('printer').value||'Не выбран';setTimeout(()=>{b.textContent='Сохранить и подключиться';b.disabled=false},1800)};$('sync').onclick=()=>pywebview.api.sync();$('updateLater').onclick=()=>$('updateDialog').hidden=true;$('updateNow').onclick=async()=>{let b=$('updateNow');b.disabled=true;b.textContent='Загрузка обновления…';let r=await pywebview.api.install_update();if(!r.ok){$('updateError').textContent=r.error;b.textContent='Повторить';b.disabled=false}};
</script></body></html>
