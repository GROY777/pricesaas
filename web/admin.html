<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#f8fafc}.card{background:white;border:1px solid #e2e8f0;border-radius:16px}.field{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;width:100%}</style><title>Admin — PriceSnap</title><script>localStorage.removeItem('theme');document.documentElement.classList.remove('dark');</script><link rel="stylesheet" href="/styles.css"><script src="/session.js?v=1"></script></head><body><header class="bg-white border-b"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"><b class="text-xl">PriceSnap <span class="text-blue-600">ADMIN</span></b><div class="flex gap-3"><a href="/" class="px-4 py-2 rounded-lg border">На сайт</a><button id="logout" class="px-4 py-2 rounded-lg bg-slate-900 text-white">Выйти</button></div></div></header><main class="max-w-7xl mx-auto p-6"><div id="login" class="max-w-md mx-auto card p-7 mt-12"><h1 class="text-2xl font-bold">Вход администратора</h1><p class="text-slate-500 mt-2">Используйте учётные данные владельца.</p><form id="loginForm" class="space-y-3 mt-6"><input id="email" class="field" type="email" placeholder="Email" required><input id="password" class="field" type="password" placeholder="Пароль" required><p id="loginError" class="text-red-600 text-sm"></p><button class="w-full bg-blue-600 text-white rounded-lg py-3">Войти</button></form></div><div id="denied" class="hidden max-w-md mx-auto card p-8 mt-12 text-center"><h1 class="text-2xl font-bold">Доступ запрещён (403)</h1><p class="text-slate-500 mt-2">Эта страница доступна только владельцу сервиса.</p><a href="/" class="inline-block mt-5 bg-blue-600 text-white rounded-lg px-5 py-3">На главную</a></div><section id="panel" class="hidden"><h1 class="text-3xl font-bold mb-6">Управление сервисом</h1><div id="stats" class="grid sm:grid-cols-4 gap-4 mb-6"></div><div class="card p-4 mb-4 flex flex-wrap gap-3"><input id="search" class="field max-w-md" placeholder="Поиск по магазину, email или ID"><select id="filter" class="field w-auto"><option value="all">Все</option><option value="pro">Только PRO</option><option value="free">Бесплатные</option><option value="blocked">Заблокированные</option></select></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-left"><tr><th class="p-4">Магазин и Email</th><th>Тариф</th><th>Статистика</th><th>Лимит</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="modal" class="rounded-2xl p-0"><form method="dialog" class="p-6 w-80"><h2 class="font-bold text-lg">PRO и лимиты</h2><input id="days" class="field mt-4" type="number" min="0" placeholder="Дней PRO"><div class="flex gap-2 mt-2"><button type="button" data-days="30" class="quick border rounded px-3 py-2">+30</button><button type="button" data-days="90" class="quick border rounded px-3 py-2">+90</button><button type="button" data-days="365" class="quick border rounded px-3 py-2">+365</button></div><input id="bonus" class="field mt-3" type="number" placeholder="Бонусных ценников"><div class="flex gap-2 mt-5"><button id="save" type="button" class="bg-blue-600 text-white rounded px-4 py-2">Сохранить</button><button type="submit" class="border rounded px-4 py-2">Закрыть</button></div><button id="free" type="button" class="text-red-600 text-sm mt-4">Снять PRO</button></form></dialog><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const $=id=>document.getElementById(id), token=document.cookie.split('; ').some(x=>x.startsWith('__Host-pricesnap_csrf=')); let selected=0;
let adminOtp=''; async function api(path,opt={},retry=false){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(adminOtp?{'X-Admin-OTP':adminOtp}:{}),...(opt.headers||{})}}); if(r.status===403){let data=await r.json().catch(()=>({}));if(data.detail==='Требуется действующий код администратора'&&!retry){adminOtp=prompt('Введите шестизначный код приложения-аутентификатора')||'';if(adminOtp)return api(path,opt,true)}$('login').classList.add('hidden');$('panel').classList.add('hidden');$('denied').classList.remove('hidden');throw Error('403')} if(r.status===401) throw Error('Войдите заново'); if(!r.ok) throw Error((await r.json()).detail||'Ошибка'); return r.json()}
function showPanel(){ $('login').classList.add('hidden');$('denied').classList.add('hidden');$('panel').classList.remove('hidden'); load() }
async function load(){let s=await api('/api/admin/stats'); $('stats').innerHTML=[['Клиенты',s.tenants],['Активных PRO',s.active_pro],['Сегодня',s.printed_today],['Всего напечатано',s.printed_total]].map(x=>`<div class="card p-5"><div class="text-xs text-slate-500">${x[0]}</div><div class="text-2xl font-bold mt-2">${x[1]}</div></div>`).join(''); let q=new URLSearchParams({search:$('search').value,plan:$('filter').value}); let rows=await api('/api/admin/tenants?'+q); $('rows').innerHTML=rows.map(t=>`<tr class="border-t"><td class="p-4"><b>${esc(t.company_name)}</b><div class="text-slate-500">${esc(t.email)}</div><small>${new Date(t.created_at).toLocaleDateString('ru-RU')}</small></td><td><span class="px-2 py-1 rounded ${t.plan==='pro'?'bg-blue-100 text-blue-700':'bg-slate-100'}">${t.plan==='pro'?'PRO до '+new Date(t.subscription_expires_at).toLocaleDateString('ru-RU'):'Бесплатный'}</span></td><td>${t.products} товаров / ${t.printed} шт.</td><td>${t.free_prints_remaining}</td><td class="p-4"><button class="text-blue-700 mr-3" onclick="openSub(${t.id})">PRO / Лимиты</button><button class="text-red-600" onclick="toggle(${t.id},${t.is_active})">${t.is_active?'Заблокировать':'Разблокировать'}</button></td></tr>`).join('')}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка входа');showPanel()}catch(e){$('loginError').textContent=e.message}};
async function openSub(id){selected=id;$('days').value='';$('bonus').value='';try{const list=await api('/api/admin/tenants/'+id+'/templates');let box=document.getElementById('templateAccess');if(!box){box=document.createElement('div');box.id='templateAccess';box.className='mt-4 space-y-2';$('free').before(box)}box.replaceChildren();const title=document.createElement('div');title.className='font-semibold text-sm';title.textContent='Доступные шаблоны ценников';box.append(title);for(const t of list.filter(x=>x.price_rub>0)){const label=document.createElement('label');label.className='flex gap-2 text-sm';const input=document.createElement('input');input.type='checkbox';input.checked=t.is_owned;input.onchange=async()=>{input.disabled=true;try{await api('/api/admin/tenants/'+id+'/templates/'+t.id,{method:'POST',body:JSON.stringify({owned:input.checked})})}catch(e){input.checked=!input.checked;alert(e.message)}finally{input.disabled=false}};label.append(input,document.createTextNode(' '+t.name+' ('+t.price_rub+' ₽)'));box.append(label)}$('modal').showModal()}catch(e){alert(e.message)}} document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{$('days').value=b.dataset.days}); $('save').onclick=async()=>{await api('/api/admin/tenants/'+selected+'/subscription',{method:'POST',body:JSON.stringify({plan:'pro',days:+$('days').value||0,bonus_prints:+$('bonus').value||0})});$('modal').close();load()}; $('free').onclick=async()=>{await api('/api/admin/tenants/'+selected+'/subscription',{method:'POST',body:JSON.stringify({plan:'free',days:0,bonus_prints:0})});$('modal').close();load()}; async function toggle(id,active){await api('/api/admin/tenants/'+id+'/toggle-block',{method:'POST',body:JSON.stringify({is_active:!active})});load()}; $('search').oninput=load;$('filter').onchange=load;$('logout').onclick=()=>priceSnapLogout(); if(token)api('/api/admin/stats').then(showPanel).catch(e=>{if(e.message!=='403'){$('login').classList.remove('hidden')}});
</script></body></html>
