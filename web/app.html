<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="/styles.css"><title>РЎРєР°РЅРµСЂ PriceSnap</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="/theme.js"></script></head><body><main class="mini-shell"><div class="mini-top"><div><span class="eyebrow">PriceSnap В· СЃРєР°РЅРµСЂ</span><h1 class="text-2xl font-bold tracking-tight mt-1">Р¦РµРЅРЅРёРєРё</h1></div><span class="badge">в—Џ &nbsp; Telegram</span></div><div class="scanner-frame"><div id="reader"></div></div><div class="flex justify-between items-center mt-3 mb-5"><p class="text-xs text-slate-500">РќР°РІРµРґРёС‚Рµ РєР°РјРµСЂСѓ РЅР° С€С‚СЂРёС…РєРѕРґ</p><button id="torch" class="text-xs font-semibold text-blue-700">Р’РєР»СЋС‡РёС‚СЊ С„РѕРЅР°СЂРёРє</button></div><form id="manual" class="flex gap-2"><input id="barcode" placeholder="Р’РІРµРґРёС‚Рµ С€С‚СЂРёС…РєРѕРґ" class="field" required><button class="btn btn-primary">РќР°Р№С‚Рё</button></form><p id="message" class="my-3 text-red-700 text-sm" role="status"></p><div class="flex justify-between items-center mt-7 mb-3"><h2 class="text-sm font-bold">РЎРїРёСЃРѕРє РґР»СЏ РїРµС‡Р°С‚Рё</h2><span class="text-xs text-slate-400">РўРѕРІР°СЂС‹</span></div><div id="cart" class="space-y-2"></div></main><div class="bottom-bar"><button id="print" class="btn btn-primary" disabled>Р Р°СЃРїРµС‡Р°С‚Р°С‚СЊ (0 С€С‚.)</button></div><script>const printButton=document.getElementById('print');if(printButton){const tg=window.Telegram.WebApp;tg.ready();tg.expand();const items=new Map();let last='',lastTime=0,busy=false,light=false;async function api(path,options={}){let r=await fetch(path,{...options,headers:{'X-Telegram-Init-Data':tg.initData,...options.headers}});let d=await r.json();if(!r.ok){let e=Error(typeof d.detail==='string'?d.detail:'РћС€РёР±РєР°');e.status=r.status;throw e}return d}async function add(code){code=code.trim();if(!code||busy||(code===last&&Date.now()-lastTime<1500))return;last=code;lastTime=Date.now();busy=true;try{let p=await api('/api/products/'+encodeURIComponent(code));let entry=items.get(code);if(entry)entry.quantity++;else items.set(code,{product:p,quantity:1});tg.HapticFeedback?.notificationOccurred('success');message.textContent='';render()}catch(e){message.textContent=e.message}finally{busy=false}}function render(){cart.replaceChildren();let total=0;for(let [code,item] of items){total+=item.quantity;let row=document.createElement('div');row.className='cart-row';let title=document.createElement('div');title.className='font-semibold';title.textContent=item.product.name;let details=document.createElement('p');details.textContent=item.product.price+' в‚Ѕ В· '+code;row.append(title,details);let controls=document.createElement('div');controls.className='flex gap-4 mt-3 items-center';for(let [label,action] of [['в€’',()=>{if(--item.quantity===0)items.delete(code)}],[String(item.quantity),null],['+',()=>item.quantity++],['РЈРґР°Р»РёС‚СЊ',()=>items.delete(code)]]){let b=document.createElement(action?'button':'span');b.textContent=label;b.className='text-blue-700';if(action)b.onclick=()=>{action();render()};controls.append(b)}row.append(controls);cart.append(row)}printButton.textContent=`Р Р°СЃРїРµС‡Р°С‚Р°С‚СЊ (${total} С€С‚.)`;printButton.disabled=!total;printButton.classList.toggle('opacity-50',!total)}manual.onsubmit=e=>{e.preventDefault();add(barcode.value);barcode.value=''};printButton.onclick=async()=>{printButton.disabled=true;try{await api('/api/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([...items].map(([barcode,v])=>({barcode,quantity:v.quantity})))});items.clear();message.textContent='Р—Р°РґР°РЅРёРµ РѕС‚РїСЂР°РІР»РµРЅРѕ РЅР° РїРµС‡Р°С‚СЊ';render()}catch(e){message.textContent=e.status===402?'Р›РёРјРёС‚ РёСЃС‡РµСЂРїР°РЅ, РїРѕРїСЂРѕСЃРёС‚Рµ РІР»Р°РґРµР»СЊС†Р° РїСЂРѕРґР»РёС‚СЊ РїРѕРґРїРёСЃРєСѓ':e.message;printButton.disabled=false}};const scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},code=>add(code)).catch(()=>message.textContent='РљР°РјРµСЂР° РЅРµРґРѕСЃС‚СѓРїРЅР°. Р’РІРµРґРёС‚Рµ С€С‚СЂРёС…РєРѕРґ РІСЂСѓС‡РЅСѓСЋ.');torch.onclick=async()=>{try{light=!light;await scanner.applyVideoConstraints({advanced:[{torch:light}]});torch.textContent=light?'Р’С‹РєР»СЋС‡РёС‚СЊ С„РѕРЅР°СЂРёРє':'Р’РєР»СЋС‡РёС‚СЊ С„РѕРЅР°СЂРёРє'}catch(e){message.textContent='Р¤РѕРЅР°СЂРёРє РЅРµРґРѕСЃС‚СѓРїРµРЅ'}};render()}</script></body></html>
