<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сканер PriceSnap</title><script src="https://cdn.tailwindcss.com"></script><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body class="bg-slate-50 text-slate-900 pb-28"><main class="max-w-lg mx-auto p-4"><h1 class="text-2xl font-bold mb-4">Сканер ценников</h1><div id="reader" class="overflow-hidden rounded-xl bg-slate-900"></div><button id="torch" class="my-3 text-blue-700">Включить фонарик</button><form id="manual" class="flex gap-2"><input id="barcode" placeholder="Введите штрихкод" class="border rounded-lg p-3 w-full" required><button class="bg-blue-700 text-white px-4 rounded-lg">Найти</button></form><p id="message" class="my-3 text-red-700"></p><div id="cart" class="space-y-2 mt-4"></div></main><div class="fixed bottom-0 inset-x-0 bg-white border-t p-4"><button id="print" class="block mx-auto max-w-lg w-full bg-blue-700 text-white p-4 rounded-xl font-bold" disabled>Распечатать (0 шт.)</button></div>
<script>const printButton=document.getElementById('print');const tg=window.Telegram.WebApp;tg.ready();tg.expand();const items=new Map();let last='',lastTime=0,busy=false,light=false;async function api(path,options={}){let r=await fetch(path,{...options,headers:{'X-Telegram-Init-Data':tg.initData,...options.headers}});let d=await r.json();if(!r.ok){let e=Error(typeof d.detail==='string'?d.detail:'Ошибка');e.status=r.status;throw e}return d}async function add(code){code=code.trim();if(!code||busy||(code===last&&Date.now()-lastTime<1500))return;last=code;lastTime=Date.now();busy=true;try{let p=await api('/api/products/'+encodeURIComponent(code));let entry=items.get(code);if(entry)entry.quantity++;else items.set(code,{product:p,quantity:1});tg.HapticFeedback?.notificationOccurred('success');message.textContent='';render()}catch(e){message.textContent=e.message}finally{busy=false}}function render(){cart.replaceChildren();let total=0;for(let [code,item] of items){total+=item.quantity;let row=document.createElement('div');row.className='bg-white rounded-xl p-4';let title=document.createElement('div');title.className='font-semibold';title.textContent=item.product.name;let details=document.createElement('p');details.textContent=item.product.price+' ₽ · '+code;row.append(title,details);let controls=document.createElement('div');controls.className='flex gap-4 mt-3 items-center';for(let [label,action] of [['−',()=>{if(--item.quantity===0)items.delete(code)}],[String(item.quantity),null],['+',()=>item.quantity++],['Удалить',()=>items.delete(code)]]){let b=document.createElement(action?'button':'span');b.textContent=label;b.className='text-blue-700';if(action)b.onclick=()=>{action();render()};controls.append(b)}row.append(controls);cart.append(row)}printButton.textContent=`Распечатать (${total} шт.)`;printButton.disabled=!total;printButton.classList.toggle('opacity-50',!total)}manual.onsubmit=e=>{e.preventDefault();add(barcode.value);barcode.value=''};printButton.onclick=async()=>{printButton.disabled=true;try{await api('/api/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([...items].map(([barcode,v])=>({barcode,quantity:v.quantity})))});items.clear();message.textContent='Задание отправлено на печать';render()}catch(e){message.textContent=e.status===402?'Лимит исчерпан, попросите владельца продлить подписку':e.message;printButton.disabled=false}};const scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},code=>add(code)).catch(()=>message.textContent='Камера недоступна. Введите штрихкод вручную.');torch.onclick=async()=>{try{light=!light;await scanner.applyVideoConstraints({advanced:[{torch:light}]});torch.textContent=light?'Выключить фонарик':'Включить фонарик'}catch(e){message.textContent='Фонарик недоступен'}};render()</script></body></html>
