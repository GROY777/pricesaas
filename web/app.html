<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="/styles.css"><title>Сканер PriceSnap</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>localStorage.removeItem('theme');document.documentElement.classList.remove('dark');</script></head><body><main class="mini-shell"><div class="mini-top"><div><span class="eyebrow">PriceSnap · сканер</span><h1 class="text-2xl font-bold tracking-tight mt-1">Ценники</h1></div><span class="badge">● &nbsp; Telegram</span></div><div id="miniReprice" hidden class="card panel my-4"><strong>Новые цены: <span id="miniRepriceCount">0</span> шт.</strong> <button id="miniRepricePrint" class="text-blue-700 font-semibold">Напечатать всё</button></div><div class="scanner-frame" id="scannerFrame"><div id="reader"></div></div><div class="flex justify-between items-center mt-3 mb-5"><p class="text-xs text-slate-500">Наведите камеру на штрихкод</p><div class="flex gap-3"><button id="scanNext" type="button" class="text-xs font-semibold text-blue-700">Сканировать следующий</button><button id="torch" class="text-xs font-semibold text-blue-700">Включить фонарик</button></div></div><form id="manual" class="flex gap-2"><input id="barcode" placeholder="Введите штрихкод" class="field" required><button class="btn btn-primary">Найти</button></form><p id="message" class="my-3 text-red-700 text-sm" role="status"></p><div class="flex justify-between items-center mt-7 mb-3"><h2 class="text-sm font-bold">Список для печати</h2><span class="text-xs text-slate-400">Товары</span></div><div id="cart" class="space-y-2"></div></main><div class="bottom-bar"><button id="print" class="btn btn-primary" disabled>Распечатать (0 шт.)</button></div><script>const printButton=document.getElementById('print');const tg=window.Telegram.WebApp;tg.ready();tg.expand();const items=new Map();let last='',lastTime=0,busy=false,light=false;async function api(path,options={}){let r=await fetch(path,{...options,headers:{'X-Telegram-Init-Data':tg.initData,...options.headers}});let d=await r.json();if(!r.ok){let e=Error(typeof d.detail==='string'?d.detail:'Ошибка');e.status=r.status;throw e}return d}async function add(code){code=code.trim();if(!code||busy||(code===last&&Date.now()-lastTime<1500))return;last=code;lastTime=Date.now();busy=true;try{let p=await api('/api/products/'+encodeURIComponent(code));let entry=items.get(code);if(entry)entry.quantity++;else items.set(code,{product:p,quantity:1});tg.HapticFeedback?.notificationOccurred('success');message.textContent='';render()}catch(e){message.textContent=e.message}finally{busy=false}}function render(){cart.replaceChildren();let total=0;for(let [code,item] of items){total+=item.quantity;let row=document.createElement('div');row.className='cart-row';let title=document.createElement('div');title.className='font-semibold';title.textContent=item.product.name;let details=document.createElement('p');details.textContent=item.product.price+' ₽ · '+code;row.append(title,details);let controls=document.createElement('div');controls.className='flex gap-4 mt-3 items-center';for(let [label,action] of [['−',()=>{if(--item.quantity===0)items.delete(code)}],[String(item.quantity),null],['+',()=>item.quantity++],['Удалить',()=>items.delete(code)]]){let b=document.createElement(action?'button':'span');b.textContent=label;b.className='text-blue-700';if(action)b.onclick=()=>{action();render()};controls.append(b)}row.append(controls);cart.append(row)}printButton.textContent=`Распечатать (${total} шт.)`;printButton.disabled=!total;printButton.classList.toggle('opacity-50',!total)}manual.onsubmit=e=>{e.preventDefault();add(barcode.value);barcode.value=''};printButton.onclick=async()=>{printButton.disabled=true;try{await api('/api/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([...items].map(([barcode,v])=>({barcode,quantity:v.quantity})))});items.clear();message.textContent='Задание отправлено на печать';render()}catch(e){message.textContent=e.status===402?'Лимит исчерпан, попросите владельца продлить подписку':e.message;printButton.disabled=false}};const formats=[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.QR_CODE];const scanner=new Html5Qrcode('reader',{formatsToSupport:formats});let scanPaused=false,scanTimer;const frame=document.getElementById('scannerFrame'),next=document.getElementById('scanNext');function resumeScan(){clearTimeout(scanTimer);scanPaused=false;last='';frame.style.outline='';next.textContent='Сканировать следующий'}async function onScan(code){if(scanPaused||busy)return;scanPaused=true;frame.style.outline='3px solid #22c55e';next.textContent='Пауза…';try{tg.HapticFeedback?.impactOccurred('medium')}catch(e){}try{await add(code)}finally{scanTimer=setTimeout(resumeScan,1800)}}next.onclick=resumeScan;scanner.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:{width:250,height:150},videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}},onScan).then(async()=>{try{await scanner.applyVideoConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}).catch(()=>message.textContent='Камера недоступна. Введите штрихкод вручную.');torch.onclick=async()=>{try{light=!light;await scanner.applyVideoConstraints({advanced:[{torch:light}]});torch.textContent=light?'Выключить фонарик':'Включить фонарик'}catch(e){message.textContent='Фонарик недоступен'}};render()</script><script src="/mini_reprice.js"></script></body></html>
