server {
    listen 80;
    server_name cardifyrbx.shop;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://cardifyrbx.shop$request_uri; }
}

server {
    listen 443 ssl;
    server_name cardifyrbx.shop;
    ssl_certificate /etc/letsencrypt/live/cardifyrbx.shop-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardifyrbx.shop-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ =404; }
}
